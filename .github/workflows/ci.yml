name: Native checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  source:
    name: Source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python3 ci/check-public-source.py
      - run: python3 ci/check-package.py --tracked --product-config ci/ottplay-integration/release/product.json
      - run: python3 ci/gen-third-party-notices.py --check
      - run: python3 -m unittest ci.test_gen_notices -v
      - run: python3 -m unittest discover -s tests -p test_replay_fixtures.py -v
      - run: python3 -m unittest discover -s scripts -p 'test_lg_*.py' -v
      - run: node scripts/check-shared-core.cjs
      - name: Test optional Home Assistant tooling and public Home integration
        run: |
          python3 -m unittest discover -s integrations/home-assistant/tests -v
          node --test integrations/home-assistant/home/dashboard/core.test.cjs integrations/home-assistant/home/dashboard/app.test.cjs integrations/home-assistant/home/dashboard/webos-host.test.cjs
          node --test integrations/home-assistant/home/bridge/server.test.cjs
          node --test integrations/home-assistant/home/network-service/test.cjs
          node --test integrations/home-assistant/home/package-webos.test.cjs
          node integrations/webos-home-helper/tests/test.cjs
          node integrations/webos-home-helper/tests/test-controller.cjs
          node integrations/webos-home-helper/tests/test-service.cjs
          python3 integrations/webos-home-helper/tests/test-package.py

  native:
    name: Native host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install host development libraries
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential pkg-config libsdl2-dev libsdl2-ttf-dev libgl1-mesa-dev libwayland-dev libglib2.0-dev
      - uses: ./.github/actions/rust-toolchain
      - name: Locate the isolated host target
        id: host-cache
        shell: bash
        env:
          NATIVE_CHECK_DIR: ${{ runner.temp }}/lg-check
        run: |
          python3 - <<'PYCACHE'
          import os
          from pathlib import Path
          workspace = Path("rust-modules").resolve()
          target = (Path(os.environ["NATIVE_CHECK_DIR"]) / "target").resolve()
          # The cache action joins its target argument to the workspace root.
          relative = os.path.relpath(target, workspace)
          assert not Path(relative).is_absolute() and (workspace / relative).resolve() == target
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("target=" + relative + "\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("NATIVE_CHECK_DIR=" + os.environ["NATIVE_CHECK_DIR"] + "\n")
          PYCACHE
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: rust-modules -> ${{ steps.host-cache.outputs.target }}
          key: native-isolated-checks
      - name: Test native application and layers
        run: python3 scripts/lg-build.py check --work-dir "$NATIVE_CHECK_DIR" --jobs 2

  renderer-replay:
    name: Controlled renderer replay
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Prepare replay evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/renderer-replay"
          git rev-parse HEAD > "$RUNNER_TEMP/renderer-replay/source-sha.txt"
          uname -sm > "$RUNNER_TEMP/renderer-replay/platform.txt"
      - name: Install renderer development libraries
        run: brew install sdl2 sdl2_ttf pkg-config
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: rust-modules
          key: controlled-renderer-replay
      - name: Build the controlled host renderer
        run: >-
          cargo +"$RUST_TOOLCHAIN" build --locked
          --manifest-path rust-modules/Cargo.toml
          --features hostsim --bin plxnative-sim
      - name: Prove outbound network denial and replay every controlled anchor
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/renderer-replay"
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network-outbound)' \
            python3 - <<'PYPROBE'
          import errno, json, os, socket
          from pathlib import Path
          with socket.socket() as connection:
              connection.settimeout(2)
              result = connection.connect_ex(("1.1.1.1", 443))
          if result not in (errno.EPERM, errno.EACCES):
              raise SystemExit("Outbound sandbox denial not proven: " + str(result))
          Path(os.environ["RUNNER_TEMP"], "renderer-replay", "network-denial.json").write_text(
              json.dumps({"outbound_denied": True, "errno": result}) + "\n")
          PYPROBE
          python3 tests/replay_fixtures.py \
            --sim rust-modules/target/debug/plxnative-sim \
            --fixtures tests/fixtures/replay --assets pkg \
            --output "$RUNNER_TEMP/renderer-replay" \
            --window 960x540 --jobs 1 --timeout 300 \
            | tee "$RUNNER_TEMP/renderer-replay/driver.log"
      - name: Retain complete replay ledgers and process results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controlled-renderer-replay-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/renderer-replay/

  local-decoder-build:
    name: Bundled local decoder and C ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/apt-install
        with:
          packages: build-essential pkg-config nasm zlib1g-dev
      - name: Build the pinned bundled decoder registry with one job
        run: python3 ci/qualify-local-multiview.py build --out "$RUNNER_TEMP/local-decoder-build"
      - name: Retain decoder identity, C ABI evidence and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-decoder-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/local-decoder-build/BUILD.json
            ${{ runner.temp }}/local-decoder-build/RESULT.json
            ${{ runner.temp }}/local-decoder-build/*.log
            ${{ runner.temp }}/local-decoder-build/decoder-bundle.tar.gz
            ${{ runner.temp }}/local-decoder-build/decoder-bundle.sha256

  local-decoder-sessions:
    name: Nine independent software decoder sessions
    needs: [local-decoder-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/apt-install
        with:
          packages: build-essential pkg-config libsdl2-dev libsdl2-ttf-dev libgl1-mesa-dev libwayland-dev libglib2.0-dev ffmpeg
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: rust-modules
          key: local-decoder-sessions
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: local-decoder-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-decoder-artifact
      - name: Verify source and bundled ABI, then qualify the exact ignored decoder test
        run: >-
          python3 ci/qualify-local-multiview.py qualify
          --artifact "$RUNNER_TEMP/local-decoder-artifact"
          --out "$RUNNER_TEMP/local-decoder-sessions"
      - name: Retain exact test inventory, fixture hashes and outcome on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-decoder-sessions-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/local-decoder-sessions/RESULT.json
            ${{ runner.temp }}/local-decoder-sessions/VERIFIED.json
            ${{ runner.temp }}/local-decoder-sessions/QUALIFIED.json
            ${{ runner.temp }}/local-decoder-sessions/*.log
            ${{ runner.temp }}/local-decoder-sessions/fixtures/MANIFEST.json

  local-virtual-output:
    name: Virtual video and audio output
    needs: [local-decoder-build, local-decoder-sessions]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/apt-install
        with:
          packages: build-essential pkg-config libsdl2-dev libsdl2-ttf-dev libgl1-mesa-dev libgl1-mesa-dri libwayland-dev libglib2.0-dev ffmpeg xvfb pulseaudio pulseaudio-utils
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: rust-modules
          key: local-decoder-sessions
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: local-decoder-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-output-decoder-artifact
      - name: Verify bundled decoder again and qualify owned virtual GL and audio output
        run: >-
          python3 ci/qualify-local-multiview.py output
          --artifact "$RUNNER_TEMP/local-output-decoder-artifact"
          --out "$RUNNER_TEMP/local-virtual-output"
      - name: Retain virtual framebuffer, PCM monitor and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-virtual-output-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/local-virtual-output/RESULT.json
            ${{ runner.temp }}/local-virtual-output/VERIFIED.json
            ${{ runner.temp }}/local-virtual-output/QUALIFIED.json
            ${{ runner.temp }}/local-virtual-output/*.log
            ${{ runner.temp }}/local-virtual-output/fixtures/MANIFEST.json
            ${{ runner.temp }}/local-virtual-output/proof-*/**

  arm:
    name: ARM shared core
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/apt-install
        with:
          packages: build-essential pkg-config libclang-18-dev
      - uses: ./.github/actions/rust-toolchain
      - uses: ./.github/actions/webos-ndk
        id: sdk
      - name: Check production application and link shared core with the television ABI
        env:
          WEBOS_SDK: ${{ steps.sdk.outputs.sdk-dir }}
        run: >-
          python3 ci/check-shared-core-arm.py
          --sdk "$WEBOS_SDK"
          --target-dir "$RUNNER_TEMP/shared-core-arm"
          --libclang /usr/lib/llvm-18/lib
          --check-application

  release-contracts:
    name: Release contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: >-
          python3 -m unittest ci.test_native_release ci.test_native_release_artifacts ci.test_native_companion_stable_coverage ci.test_native_runtime_sources
          ci.test_native_release_workflows ci.test_native_hbc_manifest ci.test_native_candidate_receipt
          ci.test_package_product_config -v

  gate:
    name: CI gate
    if: always()
    needs: [source, native, arm, release-contracts, renderer-replay, local-decoder-build, local-decoder-sessions, local-virtual-output]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require completed checks
        env:
          SOURCE: ${{ needs.source.result }}
          NATIVE: ${{ needs.native.result }}
          RENDERER_REPLAY: ${{ needs.renderer-replay.result }}
          ARM: ${{ needs.arm.result }}
          RELEASE: ${{ needs.release-contracts.result }}
          DECODER_BUILD: ${{ needs.local-decoder-build.result }}
          DECODER_SESSIONS: ${{ needs.local-decoder-sessions.result }}
          VIRTUAL_OUTPUT: ${{ needs.local-virtual-output.result }}
        run: >-
          test "$SOURCE" = success && test "$NATIVE" = success &&
          test "$RENDERER_REPLAY" = success &&
          test "$ARM" = success && test "$RELEASE" = success &&
          test "$DECODER_BUILD" = success && test "$DECODER_SESSIONS" = success &&
          test "$VIRTUAL_OUTPUT" = success
