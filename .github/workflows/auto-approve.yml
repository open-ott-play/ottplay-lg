# Trusted metadata only; never check out or execute pull-request source.
name: Auto Approve PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-approve:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["4alvit","californiantiramisu","renovate[bot]"]'), github.event.pull_request.user.login) &&
      !github.event.pull_request.draft
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@6472c9fea1eb72f9c706548092036de36230b7aa # main
    with:
      authors: '["4alvit","californiantiramisu","renovate[bot]"]'
      runner-labels: '["ubuntu-24.04"]'
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
      APPROVAL_PAT: ${{ secrets.APPROVAL_PAT }}
