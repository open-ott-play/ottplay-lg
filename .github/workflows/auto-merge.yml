# Trusted default-branch metadata only; never execute pull-request source.
name: Auto Merge PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
  workflow_run:
    workflows: ["Auto Approve PRs", "Native checks"]
    types: [completed]
  status:
  check_run:
    types: [completed]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: automerge-reviewed-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["4alvit","californiantiramisu","renovate[bot]"]'), github.event.pull_request.user.login)) ||
      (contains(fromJSON('["workflow_run","status","check_run","schedule","workflow_dispatch"]'), github.event_name) &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@0047a13b5eb79dfa770e31070a83e9696ddd36d1 # main
    with:
      runner-labels: '["ubuntu-24.04"]'
      merge-method: squash
      pr-author: "4alvit,californiantiramisu,renovate[bot]"
      reviewed-merge: true
      reviewed-single-pass: true
      allow-owned-bot-actions-review: true
      required-status-checks: "Source contracts,Native host tests,CI gate"
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
