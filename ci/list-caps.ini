# The list-cap registry: one section per cap-shaped site in non-test Rust, read by
# `ci/check-list-caps.py`. Keyed `[file::symbol]`, file relative to rust-modules/, symbol the function
# the cut sits in (else the const/struct it belongs to); several hits in one symbol share a section
# whose reason covers all of them, and a constant's section covers every use of that constant.
#
# The owner's rule: a hard cap on what the user can REACH in a list is never acceptable; a bound on
# WORK is fine. So:
#
#   class   work        bounds work or memory (per frame, per request, a window, concurrency);
#                       everything past it is still reachable
#           preview     a summary length whose full list is reachable; `route` names how
#           format      a limit of a format, protocol or hardware, not of a list the user browses
#           not-a-list  text length, retries, geometry, a buffer, remembered history
#           reach       a real cap on reachable content. Allowed ONLY with `status = open` and a
#                       reason saying what the user loses; the lint prints it loudly
#   reason  one sentence
#   route   preview only: the screen or gesture that reaches the full list
#   status  reach only: `open`
#
# Do not class a site `work` or `preview` on a guess: read the code until you know whether content
# past the bound is reachable. The list only shrinks: removing a cap removes its section.

# ---- appkit ------------------------------------------------------------

[appkit/src/hero_layout.rs::MAX_CTLS]
class = not-a-list
reason = The slot count of the hero control row's fixed array (Play, Trailer, Watched, Watchlist and the rest); a set of buttons, not a collection of content.

[appkit/src/hud_format.rs::MAX_NEAREST]
class = not-a-list
reason = How many closest valid names a lint finding's hint prints for an unknown name; a hint, not a collection of content (the whole vocabulary is in the schema and the guide).

[appkit/src/hud_format.rs::nearest]
class = not-a-list
reason = The take bounds how many characters of one candidate name the edit distance compares (the distance is quadratic), not how many items are listed; the result count is MAX_NEAREST.

[appkit/src/hud_format/parse.rs::listed]
class = preview
reason = A finding's hint names the first dozen declared assets and counts the rest, so a package with thousands of assets cannot make every finding carry them all.
route = the author's own `assets` object holds every id, and the hint says how many more there are

[appkit/src/hud_format/svg_subset.rs::MAX_ASSET_BYTES]
class = format
reason = A limit of the HUD package format: the most bytes one inline SVG asset may carry, bounding the tokenizer's work on attacker-controlled input (real icons are under 3 KiB).

[appkit/src/hud_format/svg_subset.rs::MAX_PATHS_PER_ASSET]
class = format
reason = A limit of the HUD package format: the most path elements one mask asset may carry, bounding the rasterizer's work (real icons use one to four).

[appkit/src/hud_format/parse.rs::MAX_PACKAGE_BYTES]
class = format
reason = A limit of the HUD package format: the most bytes one package file may carry, bounding the strict reader's memory on attacker-controlled input.

[appkit/src/hud_format/compile.rs::cost_of]
class = preview
reason = A state's cost report names its three largest contributors (docs/hud-plugins.md, "Cost"), while every total sums all of the state's draw ops.
route = the compiled state's draw-op list holds every op, and each op's cost is recomputed from it

[appkit/src/hud_format/compile.rs::emit_vstack]
class = not-a-list
reason = The truncate pops the condition-term stack back to its depth before the nested cell was emitted; a scope restore, not a bound on content.

[appkit/src/hud_format/compile.rs::place_row]
class = not-a-list
reason = The truncate pops the condition-term stack back to its depth before the row cell was emitted; a scope restore, not a bound on content.

