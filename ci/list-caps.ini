[platform/src/tv/secure/fixture_local.rs::LIFECYCLE_LIMIT]
class = format
reason = Explicit fixture FIFO accepts at most 32 simulated lifecycle events per process; no implicit or infinite churn.

[src/app/ott_usb_delayed_mount.rs::RETRY_WINDOW_MS]
class = not-a-list
reason = Finite two-minute foreground retry window for the same saved USB restoration intent; not a list cap.

[src/app/ott_vportal_choices.rs::MAX_CHOICES]
class = format
reason = Interactive VPortal response admits at most 16 playable variants; overflow is rejected, not silently truncated. Cleanup owns only admitted, selected/default and validated top-level resources.

[src/app/ott_vportal_choices.rs::MAX_LABEL_BYTES]
class = format
reason = Quality keys and labels are bounded to 256 UTF-8 bytes and are never truncated into a different saved preference identity.

[data/src/ott/records.rs::MAX_RETENTION_SECONDS]
class = format
reason = Records uses the existing supported M3U retention range of 365 days; a wider request is refused, never silently clamped.

[src/app/ott_providers/live.rs::MAX_GUIDE_SOURCES]
class = work
reason = One atomic Records or catalogue-row lookup admits at most 16 distinct XMLTV sources. Oversized Records fail; row batches retain the existing selected-only path without publishing partial captions.

[media/src/ff/hls_rendition.rs::BODY_LIMIT]
class = not-a-list
reason = Bounds one privately buffered HLS rendition segment to 8 MiB; an oversized body fails instead of publishing a partial segment, and this is not a catalogue or track-list length.

[media/src/ff/hls_rendition.rs::SAMPLE_LIMIT]
class = not-a-list
reason = Bounds one privately captured rendition segment to 16384 timed access units; overflow fails the whole segment rather than truncating a user-browsable list.

[src/app/ott_browse_focus.rs::MAX_PROFILES]
class = not-a-list
reason = Validates optional remembered browse-focus records for the existing ninety-profile storage envelope; it does not limit which catalogue rows can be browsed or played.

[src/app/ott_browse_focus.rs::MAX_TEXT]
class = not-a-list
reason = Bounds the UTF-8 byte lengths of one remembered entry identifier and category; overlong focus metadata is not retained, without truncating the underlying catalogue.

[src/app/ott_numeric_input.rs::DIGIT_WINDOW_MS]
class = not-a-list
reason = The two-second monotonic input deadline groups channel-number digits before dispatch; it is a time interval, not a limit on channel rows.

# ---- Native explicit command-server DNS-SD ----

[net/src/control_discovery.rs::MAX_DOMAINS]
class = work
reason = A single explicit DNS discovery scans at most 16 OS suffixes; excess configuration is refused rather than silently selecting a different server.

[net/src/control_discovery.rs::MAX_SERVERS]
class = work
reason = An explicit discovery admits at most eight distinct endpoints; excess responses are refused and manual server entry remains available.

[net/src/control_discovery.rs::WINDOW_MS]
class = not-a-list
reason = Three-second UI discovery deadline and checks between blocking resolver calls; the outstanding single task remains owned until its call returns.

[net/src/control_discovery/wire.rs::MAX_RECORDS]
class = work
reason = At most 128 DNS records are parsed from one bounded response; oversized responses are refused.

[net/src/control_discovery/wire.rs::MAX_JUMPS]
class = not-a-list
reason = Compression-pointer traversal budget prevents cycles in untrusted DNS names.

[net/src/control_discovery/wire.rs::parse]
class = format
reason = SRV RDATA has six fixed priority/weight/port octets before its target name.

[net/src/control_discovery/system.rs::MAX_CONFIG_BYTES]
class = not-a-list
reason = Bounded UTF-8 resolver configuration input, never a media or server list truncation.

[net/src/control_discovery/system.rs::query]
class = format
reason = Only the fixed 12-byte DNS header is readable after libc reports an error without a response length.

[platform/src/storage/public_preferences.rs::patch_guarded]
class = not-a-list
reason = Reads eight bytes from a fixed sixteen-byte random generation to form a 64-bit storage epoch; no catalogue or user-visible list is truncated.

