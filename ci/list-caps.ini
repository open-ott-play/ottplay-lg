reason = Bounds cues in one complete privately prepared subtitle script; overflow rejects that script instead of truncating it, and this is not a user-browsable catalogue or track list.

[media/src/ff/hls_webvtt.rs::SEGMENT_LIMIT]
class = not-a-list
