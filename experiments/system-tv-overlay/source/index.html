<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1920"><title>OTTPlay overlay probe</title><style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;color:#fff;font:32px sans-serif;overflow:hidden}aside{position:absolute;left:4%;right:4%;bottom:5%;padding:22px 30px;border:2px solid #2587e8;border-radius:18px;background:rgba(8,12,18,.82)}small{display:block;font-size:24px;margin-top:8px}button{float:right;font:24px sans-serif;padding:8px 18px;background:#164e83;color:white;border:1px solid #8fc7ff;border-radius:8px}
</style></head><body><aside><button id="close">Close</button>OTTPlay system TV overlay probe<small id="timer">No media decoder or network requests. Closes automatically in 20 seconds.</small></aside><script>
(function(){'use strict';var remaining=20;function close(){window.close();}document.getElementById('close').onclick=close;document.addEventListener('keydown',function(e){if(e.keyCode===461||e.keyCode===27){e.preventDefault();close();}});setInterval(function(){remaining--;document.getElementById('timer').textContent='No media decoder or network requests. Closing in '+remaining+' seconds.';if(remaining<=0){close();}},1000);})();
</script></body></html>
